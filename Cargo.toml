[package]
name = "winmole"
version = "1.0.0"
edition = "2021"
authors = ["WinMole Contributors"]
description = "Windows System Optimization CLI - Clean, analyze, and optimize your Windows system"
license = "MIT"
repository = "https://github.com/mrelph/WinMole"
keywords = ["windows", "system", "optimization", "cleanup", "cli"]
categories = ["command-line-utilities"]

[dependencies]
# TUI
ratatui = "0.28"
crossterm = "0.28"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Windows APIs
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Performance",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Com",
    "Win32_UI_Shell",
]}

# Serde for config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
bytesize = "1.3"
walkdir = "2.5"
directories = "5.0"
dirs = "5.0"
sysinfo = "0.31"
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
fs2 = "0.4"
lazy_static = "1.4"
regex = "1.10"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[[bin]]
name = "winmole"
path = "src/main.rs"
